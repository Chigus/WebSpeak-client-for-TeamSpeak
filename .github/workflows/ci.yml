name: Continuous integration

on:
  push:
    branches: [dev, master, nas/macau]
  pull_request:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.2
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --no-audit --no-fund
          npm run prepare:sdk
          npm rebuild @discordjs/opus --foreground-scripts --no-audit --no-fund
          npm --prefix web ci --no-audit --no-fund
      - name: Test and build application
        run: npm run verify

  docker-smoke:
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        run: |
          mkdir -p web/public/source
          git archive --format=tar --prefix="webspeak-${GITHUB_SHA}/" "$GITHUB_SHA" | gzip -n > web/public/source/webspeak-stereo-source.tar.gz
          docker build --build-arg WEBSPEAK_REVISION="$GITHUB_SHA" --tag webspeak:ci .
          test "$(docker image inspect webspeak:ci --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$GITHUB_SHA"
          docker run --rm -i --network none --read-only --cap-drop ALL --security-opt no-new-privileges --tmpfs /tmp:size=16m --workdir /app --entrypoint node webspeak:ci --input-type=module < scripts/nas/stereo-smoke.mjs
      - name: Run health smoke test
        run: |
          set -euo pipefail
          docker run --detach --name webspeak-ci --publish 3040:3040 webspeak:ci
          trap 'docker logs webspeak-ci; docker rm --force webspeak-ci' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3040/health | grep -q '"status":"ok"'; then
              curl --fail --silent http://127.0.0.1:3040/source/webspeak-stereo-source.tar.gz -o /tmp/webspeak-source.tar.gz
              cmp /tmp/webspeak-source.tar.gz web/public/source/webspeak-stereo-source.tar.gz
              exit 0
            fi
            sleep 2
          done
          exit 1
